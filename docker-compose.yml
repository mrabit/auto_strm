services:
  app:
    build: .
    container_name: auto_strm
    ports:
      - "${WEB_PORT:-28491}:3000"
    environment:
      - WEB_PORT=3000
      - TZ=Asia/Shanghai
    volumes:
      - ./config:/app/config
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
