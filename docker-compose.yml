services:
  app:
    build: .
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - WEB_PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
